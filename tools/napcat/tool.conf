# NapCat 工具配置（路径唯一来源）
# 本体：work_dir/NapCat（默认 /root/cs/NapCat，与 XRK-AGT 同级）
# LinuxQQ deb 固定 /opt/QQ，由 loadNapCat.js 注入引用上述目录

TOOL_KIND="napcat"
TOOL_NAME="NapCat"
TOOL_INSTALL_SUBDIR="NapCat"
NAPCAT_ZIP_URL="https://github.com/NapNeko/NapCatQQ/releases/latest/download/NapCat.Shell.zip"

# QQ 侧钩子（deb 安装位置，不可随意改）
QQ_ROOT="/opt/QQ"
NAPCAT_LAUNCHER="${QQ_ROOT}/resources/app/app_launcher"
QQ_PACKAGE_JSON="${QQ_ROOT}/resources/app/package.json"
QQ_MAIN_ORIGINAL="./launcher.node.js"
LOAD_NAPCAT_JS="${QQ_ROOT}/resources/app/loadNapCat.js"
QQ_BIN="${QQ_ROOT}/qq"

TOOL_DEPS=(zip unzip jq curl xvfb screen xauth procps)
# 注意：linuxqq 不能写进 TOOL_DEPS，需由 NapCat 安装流程下载腾讯 deb

# QQ 绑定与 prefs（脚本侧，重装 NapCat 不丢）；空则由 common.sh 解析为 PROJECT_ROOT/data/napcat
NAPCAT_QQ_DIR=""
NAPCAT_PREFS_FILE=""
